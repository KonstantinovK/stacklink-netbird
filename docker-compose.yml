version: '3.8'
services:
  management:
    image: netbirdio/management:latest
    restart: unless-stopped
    environment:
      - JWT_SECRET=525c6eacf89a639731b25c49c81dc60e76ee961f4db791c52c9ab01d1a85f3bf
      - HTTP_AUTHORITY=stacklink.stackroom.ru
      - IDP_HOST=http://dashboard:3000
      - IDP_MANAGER_API_KEY=auto-generated-on-first-run
      - TELEMETRY=false
    ports:
      - "33073:33073"
      - "33071:33071"
    volumes:
      - management_/var/lib/netbird

  signal:
    image: netbirdio/signal:latest
    restart: unless-stopped
    ports:
      - "10000:10000/udp"

  relay:
    image: netbirdio/relay:latest
    restart: unless-stopped
    environment:
      - RELAY_ADDR=0.0.0.0:3478
      - RELAY_EXPOSED_IP=2.59.80.62
    ports:
      - "3478:3478/udp"

  dashboard:
    image: netbirdio/dashboard:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_MANAGEMENT_API_URL=https://stacklink.stackroom.ru:33073
      - NEXT_PUBLIC_SIGNAL_API_URL=stacklink.stackroom.ru:10000
      - NEXT_PUBLIC_RELAY_API_URL=stacklink.stackroom.ru:3478
      - AUTH_AUTHORITY=http://dashboard:3000
      - AUTH0_DOMAIN=http://dashboard:3000
      - AUTH0_CLIENT_ID=netbird-client
      - AUTH0_CLIENT_SECRET=change-me-in-production
      - AUTH0_AUDIENCE=http://dashboard:3000
      - NETBIRD_MGMT_API_ENDPOINT=https://stacklink.stackroom.ru:33073
    ports:
      - "3000:3000"
    depends_on:
      - management

volumes:
  management_data:
  