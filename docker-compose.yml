version: '3.8'
services:
  management:
    image: netbirdio/management:latest
    restart: unless-stopped
    environment:
      - JWT_SECRET=525c6eacf89a639731b25c49c81dc60e76ee961f4db791c52c9ab01d1a85f3bf
      - MANAGEMENT_CONFIG_DATADIR=/var/lib/netbird
      - MANAGEMENT_CONFIG_STUNS_0_PROTO=udp
      - MANAGEMENT_CONFIG_STUNS_0_URI=stun:2.59.80.62:3478
      - MANAGEMENT_CONFIG_SIGNAL_PROTO=ws
      - MANAGEMENT_CONFIG_SIGNAL_URI=signal:10000
      - MANAGEMENT_CONFIG_HTTP_AUTH_AUDIENCE=netbird-api
      - MANAGEMENT_CONFIG_HTTP_AUTH_ISSUER=http://management:33071
      - MANAGEMENT_CONFIG_OIDC_CONFIG_ENDPOINT=http://management:33071/.well-known/openid-configuration
    ports:
      - "33071:33071"
      - "33073:33073"
    volumes:
      - management_data:/var/lib/netbird
    # Убрал монтирование management.json, используем переменные окружения

  signal:
    image: netbirdio/signal:latest
    restart: unless-stopped
    environment:
      - WS_LISTEN_ADDR=0.0.0.0:10000
      - TCP_LISTEN_ADDR=0.0.0.0:10000
    ports:
      - "10000:10000/tcp"
      - "10000:10000/udp"

  relay:
    image: netbirdio/relay:latest
    restart: unless-stopped
    environment:
      - RELAY_ADDR=0.0.0.0:3478
      - RELAY_EXPOSED_IP=2.59.80.62
      - RELAY_PORT=3478
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

  dashboard:
    image: netbirdio/dashboard:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_MANAGEMENT_API_URL=http://2.59.80.62:33071
      - NEXT_PUBLIC_SIGNAL_API_URL=ws://2.59.80.62:10000
      - NEXT_PUBLIC_RELAY_API_URL=2.59.80.62:3478
      - AUTH_AUTHORITY=http://2.59.80.62:33071
      - AUTH0_DOMAIN=http://2.59.80.62:33071
      - AUTH0_CLIENT_ID=netbird-client-id
      - AUTH0_CLIENT_SECRET=netbird-client-secret
      - AUTH0_AUDIENCE=netbird-api
      - NEXT_PUBLIC_USE_AUTH0=false  # Отключаем Auth0 для начала
    ports:
      - "3000:3000"
    depends_on:
      - management

volumes:
  management_data:
  