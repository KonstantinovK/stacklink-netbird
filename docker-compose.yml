version: '3.8'
services:
  management:
    image: netbirdio/management:latest
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - HTTP_AUTHORITY=${HTTP_AUTHORITY}
      - IDP_HOST=http://dashboard:3000
      - IDP_MANAGER_API_KEY=auto-generated-on-first-run
      - TELEMETRY=false
    ports:
      - "33073:33073"
      - "33071:33071"
    volumes:
      - management_data:/var/lib/netbird

  signal:
    image: netbirdio/signal:latest
    restart: unless-stopped
    ports:
      - "10000:10000/udp"

  relay:
    image: netbirdio/relay:latest
    restart: unless-stopped
    environment:
      - RELAY_ADDR=0.0.0.0:3478
    ports:
      - "3478:3478/udp"

  dashboard:
    image: netbirdio/dashboard:latest
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_MANAGEMENT_API_URL=https://${HTTP_AUTHORITY}:33073
      - NEXT_PUBLIC_SIGNAL_API_URL=${HTTP_AUTHORITY}:10000
      - NEXT_PUBLIC_RELAY_API_URL=${HTTP_AUTHORITY}:3478
      - AUTH_AUTHORITY=http://dashboard:3000
      - AUTH0_DOMAIN=http://dashboard:3000
      - AUTH0_CLIENT_ID=netbird-client
      - AUTH0_CLIENT_SECRET=change-me-in-production
      - AUTH0_AUDIENCE=http://dashboard:3000
    ports:
      - "3000:3000"
    depends_on:
      - management

volumes:
  management_data:
  